services:
  vllm:
    container_name: vllm
    image: nvcr.io/nvidia/vllm:26.09-py3
    restart: always
    ipc: host
    networks:
      - llm
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HOST_CACHE_DIR_HF:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${HOST_CACHE_DIR_VLLM:-~/.cache/vllm}:/root/.cache/vllm
    environment:
      HF_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      vllm serve ${VLLM_MODEL:-Qwen/Qwen3.8-27B-FP8}
        --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.72}
        --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
        --max-num-seqs ${VLLM_MAX_NUM_SEQS:-64}
        --max-num-batched-tokens ${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
        --async-scheduling
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --reasoning-parser qwen3

  litellm-db:
    container_name: litellm-db
    image: postgres:16-alpine
    restart: always
    networks:
      - llm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REPLACE_WITH_UNIQUE_SECRET}
    volumes:
      - litellm-data:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    networks:
      - llm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:main-latest
    restart: always
    networks:
      - llm
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-REPLACE_WITH_UNIQUE_SECRET}@litellm-db:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
    depends_on:
      - vllm
      - litellm-db
      - redis
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${LITELLM_NUM_WORKERS:-4}"]

  rag-db:
    container_name: rag-db
    image: pgvector/pgvector:pg18
    restart: always
    networks:
      - llm
    ports:
      - "${RAG_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${RAG_DB_NAME:-rag}
      POSTGRES_USER: ${RAG_DB_USER:-rag}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-REPLACE_WITH_UNIQUE_SECRET}
    volumes:
      - rag-data:/var/lib/postgresql
      - ./config/init-rag.sql:/docker-entrypoint-initdb.d/init-rag.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USER:-rag} -d ${RAG_DB_NAME:-rag}"]
      interval: 3s
      timeout: 2s
      retries: 5

volumes:
  litellm-data:
    name: litellm-data
  rag-data:
    name: rag-data

networks:
  llm:
    name: llm
