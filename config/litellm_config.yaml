model_list:
  # Canonical name and aliases follow VLLM_MODEL. VLLM_LITELLM_MODEL is the openai/ route.
  - model_name: os.environ/VLLM_MODEL
    litellm_params:
      model: os.environ/VLLM_LITELLM_MODEL
      api_base: http://vllm:8000/v1
      api_key: none

  - model_name: qwen
    litellm_params:
      model: os.environ/VLLM_LITELLM_MODEL
      api_base: http://vllm:8000/v1
      api_key: none

  - model_name: qwen3.8-27b
    litellm_params:
      model: os.environ/VLLM_LITELLM_MODEL
      api_base: http://vllm:8000/v1
      api_key: none

router_settings:
  routing_strategy: usage-based-routing
  redis_host: os.environ/REDIS_HOST
  redis_port: 6379

litellm_settings:
  drop_params: true
  telemetry: false
  set_verbose: false
  # vLLM reserves max_tokens inside --max-model-len. Lower the cap when the
  # prompt would otherwise overflow. See config/context_window.py.
  callbacks: context_window.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_env_credential_login: true
  coordination_redis:
    url: os.environ/REDIS_URL
